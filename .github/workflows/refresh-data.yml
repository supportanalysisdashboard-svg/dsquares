name: Refresh Dashboard Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas

      - name: Build data from Google Sheets
        env:
          DS_DATA_OUT: data
          DS_INDEX: index.html
        run: python pipeline/build_data.py

      - name: Commit and push fresh data
        run: |
          git config user.name 'dashboard-autobot'
          git config user.email 'actions@users.noreply.github.com'
          git add data index.html
          if git diff --cached --quiet; then
            echo 'No data changes; nothing to commit.'
          else
            git commit -m "Refresh dashboard data"
            git push
          fi
